<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header id="cabeçalho">

        <figure>
            <img src="./logo.png" alt="Logo">
        </figure>
        <nav>
            <a href="index.html" class="btn-nav">Home</a>
            <a href="quemsomos.html"class="btn-nav">Sobre</a>
            <a href="contato.html"class="btn-nav">Contato</a>
        </nav>

    </header>
  <main>
        <section id="banner">
            <p> Fale conosco </p>
            <h1> Entre em contato com a UNES  </h1>
        </section> 
       <div class="contato-secao">
            <div class="card-formulario">
              <h2>Envie sua mensagem</h2>
              <div class="linha-verde"></div>
          
              <form>
                <div class="campo">
                  <label for="email">Seu e-mail</label>
                  <input type="email" id="email" placeholder="voce@email.com">
                </div>
          
                <div class="campo">
                  <label for="assunto">Assunto</label>
                  <input type="text" id="assunto" placeholder="Assunto da mensagem">
                </div>
          
                <div class="campo">
                  <label for="descricao">Descrição</label>
                  <textarea id="descricao" placeholder="Escreva sua mensagem aqui..." rows="4"></textarea>
                </div>
          
                <button type="submit" class="btn-enviar">Enviar</button>
              </form>
            </div>
            <div class="canais-info">
              <h2>Outros canais</h2>
              <div class="linha-verde"></div>
          
              <div class="canal-item">
                <div class="icone-circulo">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <div>
                  <strong>E-mail</strong>
                  <span>contato@unes.edu.br</span>
                </div>
              </div>
            </div>
          </div>
        </main>
          <footer>

            <h4> @ 2026 UNES Universidade - Todos os direitos reservados</h4>
            
        </footer>
    </body>
    </html>
